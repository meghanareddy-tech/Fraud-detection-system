<text x="560" y="545" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">LocalStack · 4566</text>

<!-- Docker -->
<rect x="646" y="504" width="232" height="52" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="762" y="527" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#e6edf3" text-anchor="middle">Docker Compose</text>
