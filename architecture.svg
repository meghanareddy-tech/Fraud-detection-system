<svg width="900" height="620" viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img">
<title>AI-Powered Fraud Detection System Architecture</title>
<desc>Microservices architecture showing API Gateway routing to Payment, Fraud Detection, Notification, and AI Reasoning services connected via Apache Kafka</desc>

<!-- Background -->
<rect width="900" height="620" fill="#0d1117"/>

<!-- Title -->
<text x="450" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#e6edf3" text-anchor="middle">AI-Powered Fraud Detection System</text>
<text x="450" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">Event-Driven Microservices Architecture</text>

<!-- CLIENT BOX -->
<rect x="375" y="74" width="150" height="38" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="450" y="97" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#e6edf3" text-anchor="middle">Client / Postman</text>

<!-- Arrow: Client to Gateway -->
<line x1="450" y1="112" x2="450" y2="140" stroke="#30363d" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- API GATEWAY -->
<rect x="255" y="142" width="390" height="54" rx="8" fill="#0d419d" stroke="#388bfd" stroke-width="1.5"/>
<text x="450" y="166" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#cae8ff" text-anchor="middle">API Gateway — Port 8080</text>
<text x="450" y="184" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#79c0ff" text-anchor="middle">Spring Cloud Gateway · Circuit Breaker · Resilience4j</text>

<!-- Arrows Gateway to Services -->
<line x1="310" y1="196" x2="115" y2="262" stroke="#484f58" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="385" y1="196" x2="305" y2="262" stroke="#484f58" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="515" y1="196" x2="595" y2="262" stroke="#484f58" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="590" y1="196" x2="775" y2="262" stroke="#484f58" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- Port labels -->
<text x="188" y="238" font-family="Courier New, monospace" font-size="10" fill="#8b949e" text-anchor="middle">:8081</text>
<text x="332" y="238" font-family="Courier New, monospace" font-size="10" fill="#8b949e" text-anchor="middle">:8082</text>
<text x="568" y="238" font-family="Courier New, monospace" font-size="10" fill="#8b949e" text-anchor="middle">:8083</text>
<text x="702" y="238" font-family="Courier New, monospace" font-size="10" fill="#8b949e" text-anchor="middle">:8084</text>

<!-- SERVICE 1: Payment -->
<rect x="22" y="264" width="186" height="108" rx="8" fill="#0f2d15" stroke="#2ea043" stroke-width="1.5"/>
<text x="42" y="288" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#56d364">💳 Payment Service</text>
<text x="42" y="306" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#7ee787">Spring Boot 3.5.13</text>
<text x="42" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#7ee787">PostgreSQL · Redis Cache</text>
<text x="42" y="338" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#7ee787">Kafka Producer</text>
<text x="42" y="354" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#7ee787">Swagger UI · JUnit Tests</text>

<!-- SERVICE 2: Fraud Detection -->
<rect x="228" y="264" width="186" height="108" rx="8" fill="#0d2149" stroke="#388bfd" stroke-width="1.5"/>
<text x="248" y="288" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#79c0ff">🔍 Fraud Detection</text>
<text x="248" y="306" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#a5d6ff">Spring Boot 3.5.13</text>
<text x="248" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#a5d6ff">Rule-Based Risk Engine</text>
<text x="248" y="338" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#a5d6ff">Kafka Consumer</text>
<text x="248" y="354" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#a5d6ff">Resilience4j CB</text>

<!-- SERVICE 3: Notification -->
<rect x="462" y="264" width="186" height="108" rx="8" fill="#271b10" stroke="#d29922" stroke-width="1.5"/>
<text x="482" y="288" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#e3b341">🔔 Notification</text>
<text x="482" y="306" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#ffa657">Spring Boot 3.5.13</text>
<text x="482" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#ffa657">AWS DynamoDB</text>
<text x="482" y="338" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#ffa657">AWS S3 Audit Logs</text>
<text x="482" y="354" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#ffa657">Kafka Consumer</text>

<!-- SERVICE 4: AI Reasoning -->
<rect x="668" y="264" width="206" height="108" rx="8" fill="#22102a" stroke="#bc8cff" stroke-width="1.5"/>
<text x="688" y="288" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#d2a8ff">🤖 AI Reasoning</text>
<text x="688" y="306" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#e2c5ff">Python FastAPI :8084</text>
<text x="688" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#e2c5ff">LangChain · LangGraph</text>
<text x="688" y="338" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#e2c5ff">OpenAI GPT-4o</text>
<text x="688" y="354" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#e2c5ff">Agentic Multi-Step</text>

<!-- Kafka arrows -->
<line x1="115" y1="372" x2="115" y2="420" stroke="#f78166" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#redarr)"/>
<line x1="321" y1="420" x2="321" y2="372" stroke="#f78166" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#redarr)"/>
<line x1="555" y1="420" x2="555" y2="372" stroke="#f78166" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#redarr)"/>

<!-- Kafka labels -->
<text x="84" y="414" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#f78166">publish</text>
<text x="292" y="414" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#f78166">consume</text>
<text x="523" y="414" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#f78166">consume</text>

<!-- KAFKA BUS -->
<rect x="44" y="422" width="600" height="50" rx="8" fill="#1a0f0f" stroke="#f78166" stroke-width="1.5"/>
<text x="344" y="444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#ff9a8d" text-anchor="middle">⚡ Apache Kafka</text>
<text x="344" y="462" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#f78166" text-anchor="middle">payment-events topic · 3 partitions · Confluent 7.5 · Port 9092</text>

<!-- AI analysis call arrow (Fraud -> AI) -->
<path d="M 414 318 Q 540 298 668 318" fill="none" stroke="#bc8cff" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#purparr)"/>
<text x="545" y="296" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#bc8cff" text-anchor="middle">AI analysis call</text>

<!-- Status update arrow (Fraud -> Payment) -->
<path d="M 228 300 Q 190 278 208 278" fill="none" stroke="#388bfd" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#bluearr)"/>
<text x="195" y="268" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#388bfd" text-anchor="middle">status update</text>

<!-- INFRASTRUCTURE ROW -->
<text x="450" y="496" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#484f58" text-anchor="middle" letter-spacing="2">INFRASTRUCTURE</text>

<!-- PostgreSQL -->
<rect x="22" y="504" width="140" height="52" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="92" y="527" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#e6edf3" text-anchor="middle">PostgreSQL</text>
<text x="92" y="545" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">v15 · Port 5432</text>

<!-- Redis -->
<rect x="178" y="504" width="140" height="52" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="248" y="527" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#e6edf3" text-anchor="middle">Redis</text>
<text x="248" y="545" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">v7 · Port 6379</text>

<!-- DynamoDB -->
<rect x="334" y="504" width="140" height="52" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="404" y="527" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#e6edf3" text-anchor="middle">DynamoDB</text>
<text x="404" y="545" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">LocalStack · 4566</text>

